name: Unity Build

on:
  workflow_dispatch:

  push:
    branches:
      - BuildBranch # TARGET_BRANCHに変更

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library # PROJECT_PATHがサブフォルダなら変更
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-
            Library-${{ runner.os }}-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64

      - name: Upload build
        id: upload-build
        uses: actions/upload-artifact@v4
        with:
          name: Unity-StandaloneWindows64-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARTIFACT_URL: ${{ steps.upload-build.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"

          content=$(printf \
            '✅ Unity Build Completed\nBranch: `%s`\nCommit: `%s`\nPlatform: `StandaloneWindows64`\n[ZIPをダウンロード](%s)\n[GitHub Actionsを確認](%s)' \
            "$BRANCH_NAME" "$short_sha" "$ARTIFACT_URL" "$RUN_URL")

          jq -n \
            --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}' \
            > discord-payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
        
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"

          content=$(printf \
            '❌ Unity Build Failed\nBranch: `%s`\nCommit: `%s`\n[エラー内容を確認](%s)' \
            "$BRANCH_NAME" "$short_sha" "$RUN_URL")

          jq -n \
            --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}' \
            > discord-payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
